[package]
name = "cta"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"

anyhow = "1.0"
thiserror = "2"

serde = "1.0"
serde_json = "1.0"

url = "2.5.8"

[dependencies.poise] 
version = "0.6" 
default-features = false 
features = ["cache", "chrono", "handle_panics"] 

[dependencies.songbird] 
version = "0.5" 
default-features = false 
features = ["gateway", "serenity", "native"] 

[dependencies.tokio] 
version = "1" 
features = ["rt-multi-thread", "macros"]

[dependencies.lavalink-rs]
git = "https://gitlab.com/vicky5124/lavalink-rs/"
rev = "4e200436e16b03b8bb193bed5c0d7d9500434ea4" 
features = ["songbird", "serenity", "macros"]
