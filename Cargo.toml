[package]
name = "cta"
version = "0.1.0"
edition = "2021"

[dependencies]
twilight-gateway = "0.16"
twilight-http = "0.16"
twilight-standby = "0.16"
twilight-model = "0.16"
twilight-cache-inmemory = "0.16"

rustls-webpki = { version = "0.102", features = ["std"] }
reqwest = "0.12.2"
percent-encoding = { version = "2.3.2", optional = true }
serenity = { git = "https://github.com/serenity-rs/serenity", branch = "next"}

songbird = { git = "https://github.com/jtscuba/songbird", branch = "davey", default-features = false, features = ["driver", "gateway", "twilight", "rustls", "tws"] }
symphonia = { features = ["aac", "mp3", "isomp4", "alac"], version = "0.5.2" }

bincode = { version = "2.0.1", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }

tracing = "0.1"
tracing-subscriber = "0.3"

anyhow = "1.0"

tokio = { version = "1.42.0", features = ["full"] }

nanorand = "*"

[lints.clippy]
correctness = "deny"
suspicious = "warn"
complexity = "warn"
perf = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
